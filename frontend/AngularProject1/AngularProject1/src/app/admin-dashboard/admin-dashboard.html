<div class="dashboard-container" *ngIf="!isLoading; else loading">
  <h2>📊 Admin Dashboard</h2>

  <div *ngIf="errorMessage" class="error">
    {{ errorMessage }}
  </div>
  <div class="notification-indicator" *ngIf="notifications.length > 0"></div>
  <table *ngIf="requests.length > 0; else noRequests" class="requests-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Member</th>
        <th>Book</th>
        <th>Days</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let r of requests">

        <td>{{ r.id }}</td>

        <td class="member-cell">
          <div class="member-info">
            <div class="member-icon">👤</div>
            <span>{{ r.memberName || 'Unknown Member' }}</span>
          </div>
        </td>

        <td class="book-cell">
          <div class="book-info">
            <img [src]="'http://localhost:5114' + (r.imageUrl || '')"
                 alt="Book Cover"
                 class="book-cover"
                 (error)="onImageError($event)" />
            <div class="book-details">
              <span class="book-title">{{ r.bookTitle || 'Unknown Book' }}</span>
              <small class="book-id">#{{ r.bookId }}</small>
            </div>
          </div>
        </td>

        <td>{{ r.days }}</td>

        <td [ngClass]="{
            pending: r.ended === 'Pending',
            approved: r.ended === 'Approved',
            rejected: r.ended === 'Rejected'
          }">
          {{ r.ended }}
        </td>

        <td class="actions">
          <button *ngIf="r.ended === 'Pending'"
                  (click)="updateRequest(r.id, 'approve')"
                  class="approve-btn">
            ✅ Approve
          </button>
          <button *ngIf="r.ended === 'Pending'"
                  (click)="updateRequest(r.id, 'reject')"
                  class="reject-btn">
            ❌ Reject
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <ng-template #noRequests>
    <p class="empty">No borrow requests yet.</p>
  </ng-template>
</div>

<ng-template #loading>
  <p>Loading requests...</p>
</ng-template>
<app-popup #popup></app-popup>
