
<form (ngSubmit)="onSignup()" class="signup-form">
  <div class="form-group">
    <label for="username">username</label>
    <input type="text" id="username" [(ngModel)]="username" name="username" class="form-input" required>
  </div>

  <div class="form-group">
    <label for="email">E-mail</label>
    <input type="email" id="email" [(ngModel)]="email" name="email" class="form-input" required>
  </div>

  <div class="form-group">
    <label for="password">password</label>
    <input type="password" id="password" [(ngModel)]="password" name="password" class="form-input" required>
  </div>

  <div class="form-group">
    <label for="confirmPassword">confirm password</label>
    <input type="password" id="confirmPassword" [(ngModel)]="confirmPassword" name="confirmPassword" class="form-input" required>
  </div>

  <div class="form-group">
    <label for="image">Profile Image</label>
    <input type="file" id="image" (change)="onFileSelected($event)" class="form-input" accept="image/*">
  </div>

  <button type="submit" class="signup-btn">SIGN UP</button>
</form>

<app-popup #popup></app-popup>
