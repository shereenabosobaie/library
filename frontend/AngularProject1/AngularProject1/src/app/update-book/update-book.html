<div class="update-container" *ngIf="!isLoading; else loading">
  <h2>✏️ Update Book</h2>

  <div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>

  <form (ngSubmit)="updateBook()" *ngIf="!errorMessage">
    <div class="form-group">
      <label>Title:</label>
      <input type="text" [(ngModel)]="book.title" name="title" required />
    </div>

    <div class="form-group">
      <label>Author:</label>
      <input type="text" [(ngModel)]="book.author" name="author" required />
    </div>

    <div class="form-group">
      <label>Description:</label>
      <textarea [(ngModel)]="book.description" name="description"></textarea>
    </div>

    <div class="form-group">
      <label>Publish Year:</label>
      <input type="number" [(ngModel)]="book.publishYear" name="publishYear" />
    </div>

    <div class="form-group">
      <label>Change Image:</label>
      <input type="file" (change)="onImageSelected($event)" accept="image/*" />
      <div class="image-preview" *ngIf="previewUrl">
        <img [src]="previewUrl" alt="Preview" />
      </div>
    </div>

    <div class="actions">
      <button type="submit" class="btn-save">💾 Save Changes</button>
      <button type="button" class="btn-cancel" (click)="cancel()">Cancel</button>
    </div>
  </form>
</div>

<ng-template #loading>
  <p>Loading book details...</p>
</ng-template>

<app-popup #popup></app-popup>
