<div class="book-detail-container">

  <button class="back-btn" (click)="goBack()">← Back to Search</button>

  <div *ngIf="isLoading" class="loading">Loading book details...</div>
  <div *ngIf="!isLoading && errorMessage" class="error">{{ errorMessage }}</div>

  <div class="book-detail" *ngIf="!isLoading && book">

    <div class="book-cover-section">
      <div class="book-cover-large">
        <img [src]="'http://localhost:5114' + (book.imageUrl || book.ImageUrl)"
             [alt]="book.title || book.Title"
             class="book-image-large"
             onerror="this.src='assets/default-book.png'">
      </div>
    </div>
    <div *ngIf="isAdmin" class="admin-actions">
      <button class="update-btn" (click)="editBook()"> Edit</button>
      <button class="delete-btn" (click)="deleteBook()"> Delete</button>
    </div>
    <div class="book-info-section">

      <h1 class="book-title-large">{{ book.title || book.Title }}</h1>


      <div class="book-meta">
        <span class="book-author">by {{ book.author || book.Author }}</span>
        <div class="rating">
          <span class="stars">★★★★★</span>
          <span class="rating-text">
            rated {{ book.rate || book.Rate || 0 }}/5 stars
          </span>
        </div>
      </div>


      <div class="book-actions">
        <button class="borrow-btn" (click)="borrowBook()">Borrow</button>

        <div class="rate-section">
          <span>Rate★</span>
          <div class="star-rating">
            <span *ngFor="let star of [1,2,3,4,5]"
                  (click)="rateBook(star)"
                  class="star">★</span>
          </div>
        </div>
      </div>

      <div class="book-description">
        <p>{{ book.description || book.Description }}</p>
      </div>
    </div>
  </div>
</div>
<app-popup #popup></app-popup>
